spring.application.name=av-ecom

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:test

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.app.jwt.jwtSecret=your_jwt_secret_key
spring.app.jwt.jwtExpirationMs=86400000

# Directory (relative to project working dir) where uploaded product images are stored
app.upload.dir=uploads/images
