spring.application.name=av-ecom

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:test

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.app.jwt.jwtSecret=dadasdasdadadadadadasdsdasdasdsadasdadasdadsaasdsadasdasd
spring.app.jwt.jwtExpirationMs=86400000
